name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.1.0-rc.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and attach release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_EVENT_TAG:-${MANUAL_TAG:-}}"
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build versioned release artifacts
        run: python scripts/build-release.py --tag "${{ steps.release_tag.outputs.tag }}" --output-dir release-dist

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-dist
          sha256sum -c SHA256SUMS.txt
          for f in *.zip; do unzip -t "$f" >/dev/null; done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: it-strategen-myndigheter-${{ steps.release_tag.outputs.tag }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach artifacts to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ steps.release_tag.outputs.tag }}" release-dist/* --clobber
